rustdesk-docker-compose.yml

```bash

services:
  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: hbbr
    command: hbbr
    restart: always
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - ./data:/root
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: hbbs
    command: hbbs -r <YOUR-SERVER-IP-ADDRESS>:21117
    restart: always
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - ./data:/root

```
